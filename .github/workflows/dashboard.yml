name: Publish DualEA dashboard
on:
  push:
    branches: [main]
    paths:
      - 'Experts/Advisors/DualEA/**'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: Experts/Advisors/DualEA/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - name: Validate JavaScript and recorded data
        run: npm run check
      - name: Refresh official calendar export
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node refresh-calendar.mjs
      - name: Build static dashboard and policy endpoint
        run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: Experts/Advisors/DualEA/dashboard/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
